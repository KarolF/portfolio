    el('path',{d:`M${-w/2+15} ${-h/2+8} L${w/2-21} ${-h/2} L${w/2} ${-h/2+24} L${w/2-10} ${h/2-10} L${w/2-34} ${h/2+4} L${-w/2+13} ${h/2} L${-w/2-4} ${h/2-20}Z`,fill:'url(#stone)',stroke:'#48616a','stroke-width':7,filter:'url(#shadow)'},root);
    el('path',{d:`M${-w/2+17} ${-h/2+7} L${w/2-26} ${-h/2+8} L${w/2-47} ${-h/2+27} L${-w/2+26} ${-h/2+32}Z`,fill:'#d0d3ca',opacity:.46},root);
    el('path',{d:`M${-w/2+10} ${h/2-21} L${-w/2+60} ${h/2-8} L${w/2-42} ${h/2-11}`,stroke:'#2f505d','stroke-width':5,opacity:.33,fill:'none'},root);
    el('path',{d:`M-12 ${-h/2+9} L4 -10 L-14 14 L8 ${h/2-9} M${w/2-40} -9 L${w/2-61} 12 L${w/2-49} 30`,stroke:'#4a6570','stroke-width':4,opacity:.4,fill:'none'},root);
    for(let i=0;i<6;i++) el('circle',{cx:-w/2+30+(i*41)%(w-55),cy:-h/2+25+(i*23)%(h-45),r:2.4,fill:'#d5ddda',opacity:.5},root);
  }
  function bolt(root,id,pos,interactive=true,blocked=false) {
    const g=el('g',{class:blocked?'screw blocked-screw':'screw','data-hole':id,role:'button',tabindex:interactive&&!blocked?'0':'-1','aria-disabled':String(blocked),
      'aria-label':'Select screw '+id,transform:`translate(${pos[0]} ${pos[1]})`},root);
    el('circle',{r:34,class:'screw-hit'},g);
    el('image',{href:blocked?window.DINO_ART.BlockedScrew:window.DINO_ART.Screw,x:-22,y:-22,width:44,height:44,'pointer-events':'none'},g);
    if(interactive)bind(g,()=>tapHole(id));
    return g;
  }
  function bind(node,action) {
    node.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();action();});
    node.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();action();}});
  }
  function mount(p) {
    const state=model.getState(p.id);if(state.released)return;
    const wrapper=el('g',{class:'panel','data-id':p.id},panelLayer);pose(wrapper,state.pose);
    p.kind==='wood'?drawWood(wrapper,p):drawStone(wrapper,p);
    p.screws.forEach((pos,i)=>{
      el('circle',{cx:pos[0],cy:pos[1],r:13,fill:'#4c3427'},wrapper);
      if(!state.taken.has(i))boltElements.set(p.id+':'+i,bolt(wrapper,p.id+':'+i,pos,true,model.isCovered(p.id,i)));
    });
    panels.set(p.id,{element:wrapper});
  }
  function instruction(text) {$('instruction').textContent=text;status.textContent=text;}
  function render() {
    $('fallingLayer').innerHTML='';$('holeLayer').innerHTML='';$('parkedLayer').innerHTML='';panelLayer.innerHTML='';particles.innerHTML='';panels.clear();boltElements.clear();selectionRing=null;
    for(const h of model.holes){
      const free=!h.occupant&&!model.holeCovered(h);
      const g=el('g',{'data-hole':h.id,class:free?'empty-hole':'backing-hole',role:'button',tabindex:free?'0':'-1','aria-label':free?'Empty hole '+h.id:'Covered hole',transform:`translate(${h.x} ${h.y})`},$('holeLayer'));
      el('circle',{r:32,fill:'transparent'},g);
      el('circle',{r:free?21:17,fill:free?'#8ce1c0':'#8b633d'},g);
      el('circle',{r:free?14:11,fill:free?'#244b49':'#322e29'},g);
      if(free)bind(g,()=>tapHole(h.id));
      const attached=h.panelId&&!model.getState(h.panelId).taken.has(h.index);
      if(h.occupant&&!attached)boltElements.set(h.id,bolt($('parkedLayer'),h.id,[h.x,h.y],true,!model.screwVisible(h)));
    }
    [...level.panels].sort((a,b)=>a.layer-b.layer).forEach(mount);
    $('undo').setAttribute('aria-disabled',String(!model.canUndo));
    instruction(model.phase==='won'?'Dinosaur uncovered!':model.legalMoves().length?'Tap a screw, then an empty hole':'Holes blocked — Undo to try another move');
  }
  function pose(node,p) {node.setAttribute('transform',`translate(${p.x.toFixed(2)} ${p.y.toFixed(2)}) rotate(${p.angle.toFixed(2)})`);}
  function ease(t) {return 1-Math.pow(1-t,3);}
  function animation(duration,update,done=()=>{}) {
    const start=performance.now(),epoch=version;
    function frame(now){
      if(epoch!==version)return;
      const t=Math.min(1,(now-start)/duration);
      update(t);
      if(t<1)requestAnimationFrame(frame); else done();
    }
    requestAnimationFrame(frame);
  }
  function sparks(x,y,kind='dust') {
    const colors=kind==='gold'?['#fff0ab','#eeb250','#fffde1']:['#f8d797','#e6b779','#fff1bf'];
    for(let i=0;i<13;i++) {
      const dot=el('circle',{cx:x+(Math.random()-.5)*15,cy:y+(Math.random()-.5)*15,
        r:3+Math.random()*6,fill:colors[i%colors.length],opacity:.9,class:'floatparticle'},particles);
      dot.style.setProperty('--dx',((Math.random()-.5)*145)+'px');
      dot.style.setProperty('--dy',(-10-Math.random()*90)+'px');
      setTimeout(()=>dot.remove(),750);
    }
  }
  function configureHand() {
    const {width,height,tipX,tipY}=window.DINO_HAND_LAYOUT;
    for(const [key,value] of Object.entries({x:-tipX*width,y:-tipY*height,width,height}))$('handArt').setAttribute(key,value);
  }
  function pointHandAt(id,animated=true) {
    if(interacted)return;
    const hand=$('hand');if(hand.dataset.target===id&&hand.style.display!=='none')return;
    const h=model.getHole(id),end={x:h.x,y:h.y+14},from={...handPosition},token=++handMotion;
    hand.style.display='';hand.classList.remove('leaving','tapping');hand.dataset.target=id;
    const position=p=>{handPosition=p;hand.setAttribute('transform',`translate(${p.x} ${p.y})`);};
    if(!animated){position(end);hand.classList.add('tapping');return;}
    animation(380,t=>{if(token!==handMotion)return;const a=t*t*(3-2*t);position({x:from.x+(end.x-from.x)*a,y:from.y+(end.y-from.y)*a});},()=>{if(token===handMotion)hand.classList.add('tapping');});
  }
  function updateTutorial() {
    if(!interacted)pointHandAt(selected==='upper-rail:0'?'pocket-left':'upper-rail:0');
  }
  function dismissTutorial() {
    const hand=$('hand'),token=++handMotion,epoch=version;
    hand.dataset.target='';hand.classList.remove('tapping');hand.classList.add('leaving');
    setTimeout(()=>{if(epoch===version&&token===handMotion)hand.style.display='none';},180);
  }
  function reset() {
    stopSounds();
    scene.classList.remove('won');version++;model=new PuzzlePhysics(level.panels,level.holes);selected=null;interacted=false;
    $('modal').classList.add('hidden');$('fossilSuccess').setAttribute('opacity','0');
    render();$('hand').dataset.target='';pointHandAt('upper-rail:0',false);
  }
  function undo() {
    if(!model.undo())return;
    stopSounds();
    scene.classList.remove('won');version++;selected=null;interacted=model.removed>0;$('modal').classList.add('hidden');$('fossilSuccess').setAttribute('opacity','0');
    render();if(!interacted){$('hand').dataset.target='';pointHandAt('upper-rail:0',false);}else dismissTutorial();
    play('tap');instruction('Move undone — try another route');
  }
  function tapHole(id) {
    if(model.locked||model.phase!=='playing')return;
    const h=model.getHole(id);
    if(h.occupant){
      if(!model.screwVisible(h))return;
      selectionRing?.remove();selectionRing=null;selected=selected===id?null:id;
      if(selected){
        selectionRing=el('circle',{cx:h.x,cy:h.y,r:28,fill:'none',stroke:'#fff1a2','stroke-width':5,'pointer-events':'none'},particles);
        instruction('Choose a glowing empty hole');play('tap');

      }else instruction('Tap a screw, then an empty hole');
      updateTutorial();return;
    }
    if(!selected){instruction('Pick a screw first');return;}
    relocate(selected,id);
  }
  function relocate(from,to) {
    const move=model.moveScrew(from,to);if(move.kind==='ignored')return move;
    selected=null;interacted=true;dismissTutorial();selectionRing?.remove();selectionRing=null;
    boltElements.get(from)?.remove();play('screw');instruction('');
    const flying=bolt(particles,'travelling',move.start,false),current=version;
    animation(460,t=>{
      const x=move.start[0]+(move.end[0]-move.start[0])*ease(t),y=move.start[1]+(move.end[1]-move.start[1])*ease(t)-Math.sin(t*Math.PI)*35;
      flying.setAttribute('transform',`translate(${x} ${y}) rotate(${360*t}) scale(${1+.2*Math.sin(t*Math.PI)})`);
    },()=>{
      if(current!==version)return;
      play('seat');
      const done=()=>{if(current!==version)return;model.settle();render();if(move.kind==='drop'&&move.won)win(current);};
      if(move.kind==='park'){done();return;}
      const entry=panels.get(move.panelId);
      if(move.kind==='pivot'){
        const state=model.getState(move.panelId),remaining=state.spec.screws.findIndex((_,i)=>!state.taken.has(i)),local=state.spec.screws[remaining];
        animation(640,t=>{const angle=move.from.angle+(move.to.angle-move.from.angle)*ease(t);const [dx,dy]=rotate(local,angle);pose(entry.element,{x:move.pivot[0]-dx,y:move.pivot[1]-dy,angle});},()=>{if(move.collidedWith)play('stone');done();});
      }else{
        // Fall above holes, below parked screws and the fixed board/screw groups.
        $('fallingLayer').appendChild(entry.element);
        play('slide');animation(780,t=>{pose(entry.element,{x:move.from.x+(move.to.x-move.from.x)*ease(t),y:move.from.y+(move.to.y-move.from.y)*t*t,angle:move.from.angle+(move.to.angle-move.from.angle)*ease(t)});entry.element.style.opacity=String(1-t*t*t);},done);
      }
    });
    return move;
  }
  function win(current) {
    scene.classList.add('won');
    if(current!==version)return;
    $('fossilSuccess').setAttribute('opacity','1');
    sparks(380,700,'gold');sparks(455,525,'gold');
    play('win');status.textContent='Dinosaur discovered. Play now.';
    setTimeout(()=>{if(current===version)$('modal').classList.remove('hidden');},700);
  }
  function cta() {
    const config=window.dinoAdConfig||{};
    const query=new URLSearchParams(window.location.search);
    const url=config.clickUrl||query.get('click_url')||'';
    if(!/^https:\/\//i.test(url)){reset();return;}
    if(window.mraid&&typeof window.mraid.open==='function'){window.mraid.open(url);return;}
    if(window.ExitApi&&typeof window.ExitApi.exit==='function'){window.ExitApi.exit();return;}
    window.open(url,'_blank','noopener,noreferrer');
  }
  $('primaryButton').addEventListener('click',cta);
  $('secondaryButton').addEventListener('click',reset);
  $('undo').addEventListener('click',undo);
  $('restart').addEventListener('click',()=>{reset();play('tap');});
  $('soundToggle').addEventListener('click',()=>{
    muted=!muted;
    if(muted)stopSounds();
    $('soundIcon').dataset.art=muted?'SoundOff':'SoundOn';$('soundIcon').setAttribute('href',window.DINO_ART[$('soundIcon').dataset.art]);
    $('soundToggle').setAttribute('aria-pressed',String(muted));
    if(!muted)play('tap');
  });
  window.addEventListener('pagehide',stopSounds);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)stopSounds();});
  for(const id of ['primaryButton','secondaryButton','restart','soundToggle','undo']){
    $(id).addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){e.preventDefault();$(id).dispatchEvent(new Event('click'));}
    });
  }
  configureHand();reset();
  window.DinoDigDebug={
    getState:()=>({phase:model.phase,removed:model.removed,locked:model.locked,
      panels:[...model.states.values()].map(s=>({id:s.spec.id,taken:[...s.taken],released:s.released,pose:{...s.pose}})),
      holes:model.holes,selected,canUndo:model.canUndo,visible:model.visibleScrews()}),
    reset,
    tapHole, relocate, undo,
    model:()=>model,
  };
})();
</script>
</body>
