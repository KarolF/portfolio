<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7dca1">
<meta name="description" content="Tiki Treats — tap the matching tropical pastry to serve your happy island guests.">
<title>Tiki Treats</title>
<style>
  :root { color-scheme: light; --brown: #603517; --aqua: #66b9ab; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: #eacb92; font-family: "Trebuchet MS", Arial, sans-serif; color: var(--brown); touch-action: manipulation; overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
  body::before { content: ""; position: fixed; inset: -35px; background: var(--scene) center / cover; filter: blur(24px) saturate(.8); opacity: .78; }
  button { font: inherit; border: 0; cursor: pointer; touch-action: manipulation; color: inherit; }
  button:focus-visible { outline: 4px solid #3e9892; outline-offset: 5px; }
  #sound { position: absolute; z-index: 40; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); width: 44px; height: 44px; display: grid; place-items: center; border: 2px solid #fff7db; border-radius: 50%; background: #fff5dce8; box-shadow: 0 3px 0 #b78c57; }
  #sound svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  #fit-area { position: relative; width: 100%; height: 100%; height: 100dvh; display: flex; justify-content: center; align-items: center; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #viewport { position: relative; flex: none; }
  #game { position: relative; width: 450px; height: 800px; overflow: hidden; transform-origin: top left; isolation: isolate; border-radius: 23px; background: #f9e0aa; box-shadow: 0 18px 80px #6c552a40; }
  #background { position: absolute; inset: 0; width: 450px; height: 800px; object-fit: fill; pointer-events: none; }
  .sprite { display: block; width: 100%; height: 100%; background-image: var(--atlas); background-repeat: no-repeat; pointer-events: none; }
  #guests { position: absolute; inset: 0; }
  .guest { position: absolute; top: 143px; width: 225px; height: 233px; }
  .guest:nth-child(1) { left: 7px; }
  .guest:nth-child(2) { right: 0; }
  .character { position: absolute; z-index: 2; left: 0; top: -26px; width: 225px; height: 225px; transform-origin: 50% 90%; animation: breathe 3.6s ease-in-out infinite; }
  .guest:nth-child(2) .character { animation-delay: -1.8s; }
  .character .pose { position: absolute; inset: 0; transition: opacity 140ms ease; }
  .pose.happy { opacity: 0; }
  .guest.cheer .pose.idle { opacity: 0; }
  .guest.cheer .pose.happy { opacity: 1; }
  .guest.cheer .character { animation: celebrate 600ms cubic-bezier(.2,.7,.3,1) both; }
  .counter-front { position: absolute; left: 0; top: 350px; width: 450px; height: 50px; background-image: var(--scene); background-size: 450px 800px; background-position: 0 -350px; z-index: 3; pointer-events: none; }
  .ticket { position: absolute; top: 156px; left: 9px; width: 199px; height: 87px; z-index: 4; border: 3px solid #fff7db; border-radius: 18px; background: linear-gradient(140deg, #fffbe9, #fff3d2 72%, #f4dfb4); box-shadow: 0 5px 0 #c7a069, 0 7px 1px #9e774b80, inset 0 0 0 1px #e7ce9c; transform-origin: 50% 70%; }
  .guest:nth-child(2) .ticket { left: 10px; }
  .ticket::before { content: ""; position: absolute; inset: 5px; border: 1px solid #e4ce9f77; border-radius: 12px; pointer-events: none; }
  .order-items { position: absolute; inset: 11px 7px 10px; display: flex; gap: 5px; }
  .order-item { position: relative; flex: 1; min-width: 0; height: 60px; border-radius: 12px; background: #f4e2bd80; box-shadow: inset 0 1px 2px #a47b3a14; }
  .order-item .sprite { filter: drop-shadow(0 3px 1px #9c683d26); transition: transform 180ms ease, opacity 160ms ease; }
  .order-check { position: absolute; top: 17px; left: calc(50% - 13px); width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; background: #76bd85; box-shadow: 0 2px 0 #4d9b6e, inset 0 1px #ffffff88; color: #fff8da; font: bold 19px/1 Arial, sans-serif; transform: scale(0) rotate(-18deg); transition: transform 210ms cubic-bezier(.2,1.6,.4,1); }
  .order-item.filled .sprite { opacity: .24; transform: scale(.8); }
  .order-item.filled .order-check { transform: scale(1) rotate(0); }
  .ticket.new-request .order-item { animation: request-enter 330ms cubic-bezier(.2,1.3,.4,1) both; }
  .ticket.finished { opacity: 0; transform: scale(.92); transition: opacity 250ms ease, transform 250ms ease; }
  .ticket.request-nudge { animation: request-nudge 450ms ease both; }
  #instruction { position: absolute; left: 0; right: 0; top: 407px; height: 47px; margin: 0; text-align: center; font: 900 30px/47px "Trebuchet MS", Arial, sans-serif; letter-spacing: -.6px; text-shadow: 0 2px 0 #fff2ca; z-index: 5; }
  .tray { position: absolute; left: 15px; top: 463px; width: 420px; height: 274px; border: 7px solid #8cd2c3; border-radius: 34px; background: linear-gradient(135deg, #80c6b8, #58a899); box-shadow: 0 6px 0 #4eaa9c, 0 10px 0 #3c8c8155, 0 14px 14px #946a3433, inset 0 4px 0 #4c9e91, inset 0 -3px 0 #b0e0ca; z-index: 5; }
  .tray::before { content: ""; position: absolute; inset: 5px; border: 2px solid #b7e5cc88; border-radius: 23px; pointer-events: none; }
  #board { position: absolute; inset: 9px 8px 12px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); column-gap: 10px; row-gap: 15px; }
  .stack { position: relative; min-width: 0; min-height: 0; }
  .tile-layer { position: absolute; left: 1px; right: 1px; top: 5px; bottom: -3px; border-radius: 24px; background: #e6bd76; border: 2px solid #ddb779; box-shadow: inset 0 -3px 0 #c99d5c; }
  .tile { position: absolute; inset: 0; width: 100%; height: 100%; padding: 1px; border: 3px solid #fff3cc; border-radius: 24px; background: linear-gradient(135deg, #fff8df, #ffedc2 70%, #f6dca4); box-shadow: 0 6px 0 #d3ab69, 0 8px 0 #ab87558c, inset 0 0 0 2px #eac990, inset 0 4px 4px #fffbe9; transform-origin: 50% 80%; transition: filter 120ms ease; }
  .tile::before { content: ""; position: absolute; inset: 7px; border: 2px solid #efd29b; border-radius: 17px; pointer-events: none; }
  .tile .sprite { position: absolute; left: 5%; top: 0; width: 90%; height: 100%; filter: drop-shadow(0 4px 2px #98622e2b); }
  .tile::after { content: ""; position: absolute; width: 11px; height: 7px; left: 15px; top: 11px; border-radius: 50%; background: #fffbed; transform: rotate(-40deg); opacity: .75; pointer-events: none; }
  .tile:active { filter: brightness(1.04); }
  .tile:disabled { cursor: default; }
  .empty .tile { opacity: .36; box-shadow: inset 0 1px 3px #8f68361a; }
  .empty .tile .sprite, .empty .tile::after { opacity: 0; }
  .empty .tile-layer { opacity: 0; }
  .tile.settle { animation: settle 370ms cubic-bezier(.2,.8,.4,1) both; }
  .tile.wrong { animation: wrong 350ms ease both; }
  .tile.hint { animation: hint 1400ms ease-in-out infinite; }
  .flying-treat { position: absolute; width: 113px; height: 113px; pointer-events: none; z-index: 15; filter: drop-shadow(0 7px 5px #8e5f353b); will-change: transform; }
  #guide-hand { position: absolute; width: 57px; height: 65px; z-index: 16; pointer-events: none; filter: drop-shadow(0 3px 1px #65411a4d); animation: hand-tap 1400ms ease-in-out infinite; transition: opacity 160ms ease; }
  #guide-hand svg { width: 100%; height: 100%; }
  #guide-hand.hidden { opacity: 0; }
  #particles { position: absolute; inset: 0; width: 450px; height: 800px; z-index: 20; pointer-events: none; }
  #end-screen { position: absolute; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; background: #e4e2b861; backdrop-filter: blur(6px); padding: 32px; visibility: hidden; opacity: 0; transition: opacity 350ms ease, visibility 350ms ease; }
  #end-screen.visible { visibility: visible; opacity: 1; }
  .end-card { position: relative; width: 100%; text-align: center; padding: 18px 25px 27px; border: 4px solid #fff5cf; border-radius: 32px; background: linear-gradient(135deg, #fffae3, #ffebc2); box-shadow: 0 8px 0 #cda467, 0 18px 35px #76572a33; transform: translateY(30px) scale(.9); transition: transform 430ms cubic-bezier(.2,1.2,.4,1); }
  .visible .end-card { transform: translateY(0) scale(1); }
  .end-friends { position: relative; height: 192px; margin: 0 -15px; }
  .end-friends .friend { position: absolute; top: 5px; width: 192px; height: 192px; }
  .end-friends .friend:first-child { left: -5px; transform: rotate(-7deg); }
  .end-friends .friend:nth-child(2) { right: -5px; transform: rotate(7deg); }
  .end-sparkle { position: absolute; color: #e6b74d; font-size: 31px; text-shadow: 0 2px #fff6c0; }
  .end-sparkle.one { left: 7px; top: 12px; transform: rotate(-12deg); }
  .end-sparkle.two { right: 3px; top: 84px; font-size: 23px; }
  #end-title { font: 900 34px/1.1 "Trebuchet MS", Arial, sans-serif; letter-spacing: -1px; color: #6d3d1f; margin: 5px 0 23px; text-shadow: 0 2px #fff5d7; }
  #replay { position: relative; width: 100%; height: 62px; border-radius: 21px; border: 2px solid #ffe4a0; background: linear-gradient(#ffc950, #f3a633); box-shadow: 0 5px 0 #c17e21, inset 0 2px 0 #ffe8a5; color: #774113; font-size: 23px; font-weight: 900; text-shadow: 0 1px #ffde84; }
  #replay:active { transform: translateY(3px); box-shadow: 0 2px 0 #c17e21; }
  #replay::after { content: ""; position: absolute; inset: -8px 0; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  @media (hover: hover) { .tile:hover:not(:disabled) { filter: brightness(1.035); } }
  @media (max-width: 500px) { #game { border-radius: 0; box-shadow: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  @keyframes breathe { 0%, 100% { transform: translateY(0) rotate(-.6deg); } 50% { transform: translateY(-3px) rotate(.6deg); } }
  @keyframes celebrate { 0%, 100% { transform: translateY(0) scale(1); } 25% { transform: translateY(-8px) scale(1.025) rotate(-3deg); } 58% { transform: translateY(-1px) rotate(2deg); } }
  @keyframes request-enter { from { opacity: .25; transform: translateY(7px) scale(.7); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes request-nudge { 40% { box-shadow: 0 5px 0 #c7a069, 0 0 0 5px #fff5be; transform: scale(1.04); } }
  @keyframes settle { 0% { transform: translateY(-6px) scale(.95); } 60% { transform: translateY(3px) scale(1.025,.97); } 100% { transform: translateY(0) scale(1); } }
  @keyframes wrong { 20%, 60% { transform: translateX(-4px) rotate(-2deg); } 40%, 80% { transform: translateX(4px) rotate(2deg); } }
  @keyframes hint { 0%, 100% { box-shadow: 0 6px 0 #d3ab69, 0 8px 0 #ab87558c, 0 0 0 0 #fff9c000; } 50% { box-shadow: 0 6px 0 #d3ab69, 0 8px 0 #ab87558c, 0 0 0 6px #fff9c0bb, 0 0 16px #fff3aa; } }
  @keyframes hand-tap { 0%, 100% { transform: translateY(0) rotate(-16deg); } 38% { transform: translateY(-8px) rotate(-12deg); } 55% { transform: translateY(1px) rotate(-16deg); } }
</style>
</head>
<body>
<main id="fit-area" aria-label="Tiki Treats game"><div id="viewport"><section id="game" aria-label="Tap pastries to match the guests’ orders">
  <img id="background" alt="" aria-hidden="true">
  <button id="sound" type="button" aria-label="Turn sound off" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5M15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/></svg></button>
  <div id="guests"></div>
  <div class="counter-front" aria-hidden="true"></div>
  <p id="instruction">Tap to serve.</p>
  <section class="tray" aria-label="Pastry tray"><div id="board"></div></section>
  <div id="guide-hand" class="hidden" aria-hidden="true"><svg viewBox="0 0 52 62"><path d="M19 33V10c0-7 9-7 9 0v15c5-5 10-2 10 3 7-3 12 2 10 9l-6 19H18L6 40c-5-7 2-12 7-7l6 5" fill="#fffaf0" stroke="#805e4b" stroke-width="2.4" stroke-linejoin="round"/><path d="M28 27v11m10-8-1 11" fill="none" stroke="#d9c6b2" stroke-width="2" stroke-linecap="round"/></svg></div>
  <canvas id="particles" width="450" height="800" aria-hidden="true"></canvas>
  <div class="sr-only" id="progress" role="progressbar" aria-label="Treats served" aria-valuemin="0" aria-valuemax="24" aria-valuenow="0"></div>
  <div class="sr-only" id="announcement" aria-live="polite" aria-atomic="true"></div>
  <section id="end-screen" role="dialog" aria-modal="true" aria-labelledby="end-title" aria-hidden="true"><div class="end-card"><div class="end-friends" id="end-friends" aria-hidden="true"></div><h1 id="end-title">Sweet success!</h1><button id="replay">Play again</button></div></section>
</section></div></main>

const KINDS = ['pineapple', 'coconut', 'melon', 'star', 'mango', 'banana'];
const NAMES = { pineapple: 'Pineapple tart', coconut: 'Coconut donut', melon: 'Watermelon macaron', star: 'Starfish cookie', mango: 'Mango cupcake', banana: 'Banana croissant' };
const TICKETS = [
  { items: ['pineapple', 'coconut', 'melon'] },
  { items: ['banana', 'mango', 'star'] },
  { items: ['pineapple', 'pineapple', 'mango'] },
  { items: ['coconut', 'melon', 'star'] },
  { items: ['coconut', 'coconut', 'banana'] },
  { items: ['melon', 'melon', 'mango'] },
  { items: ['star', 'star', 'banana'] },
  { items: ['pineapple', 'mango', 'banana'] }
];
const $ = id => document.getElementById(id);
const game = $('game');
const board = $('board');
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
const state = { stock: [], guests: [null, null], next: 0, served: 0, completed: 0, busy: false, ended: false, first: true, run: 0 };
const timers = new Set();
const animations = new Set();
const cheerTimers = [0, 0];
let scale = 1;
let particles = [];
let particleFrame = 0;
let lastParticleTime = 0;
let muted = false;
let audio = null;
let audioReady = null;
let audioUnlocked = false;
let audioResuming = false;
let audioGeneration = 0;
const soundBuffers = {};
const lastSoundVariant = {};
const activeSounds = new Set();

function updateSound() {
  $('sound').setAttribute('aria-pressed', String(!muted));
  $('sound').setAttribute('aria-label', muted ? 'Turn sound on' : 'Turn sound off');
  $('sound').innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5' + (muted ? 'M16 9l5 6M21 9l-5 6' : 'M15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14') + '"/></svg>';
}

function stopSounds() {
  audioGeneration++;
  audioUnlocked = false;
  audioResuming = false;
  stopVoices();
}

function stopVoices() {
  for (const source of activeSounds) {
    source.stop();
    source.disconnect();
  }
  activeSounds.clear();
}

function prepareSounds() {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
  if (!audioReady) audioReady = Promise.all(Object.entries(ASSETS.sounds).map(async ([kind, clips]) => {
    soundBuffers[kind] = await Promise.all(clips.map(clip => {
      const bytes = Uint8Array.from(atob(clip), character => character.charCodeAt(0));
      return audio.decodeAudioData(bytes.buffer);
    }));
  }));
  return audioReady;
}

function playSound(kind, generation) {
  const variants = soundBuffers[kind];
  if (muted || !audioUnlocked || document.hidden || generation !== audioGeneration || !variants || !audio || (audio.state !== 'running' && !audioResuming)) return;
  const previous = variants.length > 1 ? lastSoundVariant[kind] : undefined;
  let index = Math.floor(Math.random() * (variants.length - (previous === undefined ? 0 : 1)));
  if (previous !== undefined && index >= previous) index++;
  lastSoundVariant[kind] = index;
  if (activeSounds.size >= 3) {
    const oldest = activeSounds.values().next().value;
    oldest.stop(); oldest.disconnect(); activeSounds.delete(oldest);
  }
  const source = audio.createBufferSource();
  source.buffer = variants[index];
  source.connect(audio.destination);
  source.onended = () => { activeSounds.delete(source); source.disconnect(); };
  activeSounds.add(source);
  source.start();
}

$('sound').addEventListener('click', () => {
  muted = !muted;
  updateSound();
  if (muted) stopSounds();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) stopSounds(); });
function resumeSounds(event) {
  if (!event.isTrusted || muted || document.hidden || (event.type === 'keydown' && event.key !== 'Enter' && event.key !== ' ')) return;
  audioUnlocked = true;
  try {
    if (!audio) prepareSounds().catch(() => {});
    if (audio && audio.state !== 'running' && !audioResuming) {
      const generation = audioGeneration;
      audioResuming = true;
      audio.resume().then(() => {
        if (generation !== audioGeneration) return;
        audioResuming = false;
        if (audio.state !== 'running') stopSounds();
      }, () => { if (generation === audioGeneration) stopSounds(); });
    }
  } catch (_) { stopSounds(); /* Gameplay remains available if audio is unsupported. */ }
}
board.addEventListener('pointerdown', resumeSounds, true);
board.addEventListener('keydown', resumeSounds, true);
window.addEventListener('pagehide', stopSounds);
try { prepareSounds().catch(() => {}); } catch (_) { /* Audio preparation must not block the game. */ }

function later(fn, ms) {
  const id = setTimeout(() => { timers.delete(id); fn(); }, ms);
  timers.add(id);
  return id;
}

function sprite(id, extraClass = '') {
  const f = ASSETS.frames[id];
  const size = (ASSETS.width / f.w * 100) + '% ' + (ASSETS.height / f.h * 100) + '%';
  const position = (f.x / (ASSETS.width - f.w) * 100) + '% ' + (f.y / (ASSETS.height - f.h) * 100) + '%';
  return '<span class="sprite ' + extraClass + '" aria-hidden="true" style="background-size:' + size + ';background-position:' + position + '"></span>';
}

function fit() {
  const area = $('fit-area');
  const rect = area.getBoundingClientRect();
  const css = getComputedStyle(area);
  const width = rect.width - parseFloat(css.paddingLeft) - parseFloat(css.paddingRight);
  const height = rect.height - parseFloat(css.paddingTop) - parseFloat(css.paddingBottom);
  scale = Math.min(width / 450, height / 800, 1.15);
  $('viewport').style.width = 450 * scale + 'px';
  $('viewport').style.height = 800 * scale + 'px';
  game.style.transform = 'scale(' + scale + ')';
}

function point(element) {
  const rect = element.getBoundingClientRect();
  const scene = game.getBoundingClientRect();
  return { x: (rect.left + rect.width / 2 - scene.left) / scale, y: (rect.top + rect.height / 2 - scene.top) / scale };
}

function announce(message) { $('announcement').textContent = message; }

function renderGuest(lane, animate = false) {
  const order = state.guests[lane];
  const animal = lane === 0 ? 'monkey' : 'toucan';
  let guest = $('guest-' + lane);
  if (!guest) {
    guest = document.createElement('article');
    guest.id = 'guest-' + lane;
    guest.className = 'guest';
    $('guests').appendChild(guest);
    guest.innerHTML = '<div class="character"><div class="pose idle">' + sprite(animal + '_idle') + '</div><div class="pose happy">' + sprite(animal + '_happy') + '</div></div><div class="ticket"></div>';
  }
  const ticket = guest.querySelector('.ticket');
  ticket.className = 'ticket' + (animate ? ' new-request' : '') + (order ? '' : ' finished');
  if (!order) {
    guest.setAttribute('aria-label', animal + ', happily served');
    ticket.innerHTML = '';
    return;
  }
  guest.setAttribute('aria-label', animal + ' order, ' + order.filled.filter(Boolean).length + ' of 3 served');
  ticket.innerHTML = '<div class="order-items">' + TICKETS[order.index].items.map((kind, item) => '<div class="order-item' + (order.filled[item] ? ' filled' : '') + '" data-item="' + item + '" aria-label="' + NAMES[kind] + (order.filled[item] ? ', served' : ', requested') + '">' + sprite(kind) + '<span class="order-check" aria-hidden="true">✓</span></div>').join('') + '</div>';
}

function nextGuest(lane, animate = true) {
  state.guests[lane] = state.next < TICKETS.length ? { index: state.next++, filled: [false, false, false], leaving: false } : null;
  renderGuest(lane, animate);
}

function renderStack(index) {
  const kind = KINDS[index];
  const count = state.stock[index];
  let stack = $('stack-' + index);
  if (!stack) {
    stack = document.createElement('div');
    stack.id = 'stack-' + index;
    board.appendChild(stack);
  }
  stack.className = 'stack' + (count ? '' : ' empty');
  stack.innerHTML = (count > 1 ? '<div class="tile-layer" aria-hidden="true"></div>' : '') + '<button class="tile" data-stack="' + index + '" aria-label="' + NAMES[kind] + ', ' + count + ' remaining"' + (count ? '' : ' disabled') + '>' + sprite(kind) + '</button>';
  stack.querySelector('.tile').addEventListener('click', () => serve(index));
}

function findTarget(kind) {
  for (let lane = 0; lane < 2; lane++) {
    const order = state.guests[lane];
    if (!order || order.leaving) continue;
    const item = TICKETS[order.index].items.findIndex((requested, index) => requested === kind && !order.filled[index]);
    if (item >= 0) return { lane, item, order };
  }
  return null;
}

function clearHint() {
  board.querySelectorAll('.tile.hint').forEach(tile => tile.classList.remove('hint'));
  $('guide-hand').classList.add('hidden');
}

function hint() {
  if (!state.first || state.busy || state.ended) return;
  clearHint();
  const index = KINDS.findIndex((kind, i) => state.stock[i] && findTarget(kind));
  if (index < 0) return;
  const tile = $('stack-' + index).querySelector('.tile');
  const center = point(tile);
  tile.classList.add('hint');
  $('guide-hand').style.left = center.x + 18 + 'px';
  $('guide-hand').style.top = center.y + 25 + 'px';
  $('guide-hand').classList.remove('hidden');
}

function cheer(lane) {
  const guest = $('guest-' + lane);
  clearTimeout(cheerTimers[lane]);
  timers.delete(cheerTimers[lane]);
  guest.classList.remove('cheer');
  void guest.offsetWidth;
  guest.classList.add('cheer');
  cheerTimers[lane] = later(() => guest.classList.remove('cheer'), reducedMotion.matches ? 150 : 650);
}

async function fly(kind, from, to) {
  const flying = document.createElement('div');
  flying.className = 'flying-treat';
  flying.innerHTML = sprite(kind);
  flying.style.left = from.x - 56.5 + 'px';
  flying.style.top = from.y - 56.5 + 'px';
  game.appendChild(flying);
  const dx = to.x - from.x;
  const dy = to.y - from.y;
  const animation = flying.animate([
    { transform: 'translate(0,0) scale(1) rotate(-3deg)', opacity: 1 },
    { transform: 'translate(' + dx * .38 + 'px,' + (dy * .5 - 42) + 'px) scale(1.12) rotate(8deg)', opacity: 1, offset: .48 },
    { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.73) rotate(0)', opacity: .9 }
  ], { duration: reducedMotion.matches ? 10 : 510, easing: 'cubic-bezier(.25,.6,.3,1)', fill: 'forwards' });
  animations.add(animation);
  try { await animation.finished; } catch (_) { /* Replay cancels any old flight. */ }
  animations.delete(animation);
  flying.remove();
}

async function serve(index) {
  if (state.busy || state.ended || !state.stock[index]) return;
  const kind = KINDS[index];
  const target = findTarget(kind);
  const tile = $('stack-' + index).querySelector('.tile');
  if (!target) {
    if (!state.guests.some(order => order && !order.leaving && order.filled.some(filled => !filled))) return;
    tile.classList.remove('wrong');
    void tile.offsetWidth;
    tile.classList.add('wrong');
    document.querySelectorAll('.ticket').forEach(ticket => {
      ticket.classList.remove('request-nudge');
      void ticket.offsetWidth;
      ticket.classList.add('request-nudge');
    });
    announce('Match the pastry shown on a guest’s card.');
    playSound('failure', audioGeneration);
    return;
  }
  state.busy = true;
  board.setAttribute('aria-busy', 'true');
  const run = state.run;
  const soundGeneration = audioGeneration;
  state.first = false;
  clearHint();
  const hadFocus = document.activeElement === tile;
  const from = point(tile);
  const guest = $('guest-' + target.lane);
  const ticket = guest.querySelector('.ticket');
  const slot = ticket.querySelector('[data-item="' + target.item + '"]');
  const to = point(slot);
  state.stock[index]--;
  target.order.filled[target.item] = true;
  renderStack(index);
  const replacement = $('stack-' + index).querySelector('.tile');
  replacement.classList.add('settle');
  if (hadFocus) {
    const focusTarget = state.stock[index] ? replacement : board.querySelector('.tile:not(:disabled)');
    if (focusTarget) focusTarget.focus({ preventScroll: true });
  }
  await fly(kind, from, to);
  if (run !== state.run) return;
  slot.setAttribute('aria-label', NAMES[kind] + ', served');
  slot.classList.add('filled');
  guest.setAttribute('aria-label', (target.lane === 0 ? 'monkey' : 'toucan') + ' order, ' + target.order.filled.filter(Boolean).length + ' of 3 served');
  cheer(target.lane);
  burst(to.x, to.y, 12);
  state.served++;
  $('progress').setAttribute('aria-valuenow', String(state.served));
  announce(NAMES[kind] + ' served. ' + state.served + ' of 24 treats.');
  const complete = target.order.filled.every(Boolean);
  if (state.served !== 24) playSound(complete ? 'order_completed' : 'pastry_served', soundGeneration);
  if (complete) {
    target.order.leaving = true;
    state.completed++;
    later(() => { if (run === state.run) nextGuest(target.lane); }, reducedMotion.matches ? 30 : 410);
  }
  later(() => { if (run === state.run) { state.busy = false; board.setAttribute('aria-busy', 'false'); } }, reducedMotion.matches ? 15 : 190);
  if (state.served === 24) {
    state.ended = true;
    later(finish, reducedMotion.matches ? 80 : 800);
  }
}

const particleContext = $('particles').getContext('2d');
function burst(x, y, count) {
  if (reducedMotion.matches) return;
  const colors = ['#fff8c8', '#ffc757', '#ff8b86', '#6dc7b0'];
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 45 + Math.random() * 105;
    particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 30, life: .6 + Math.random() * .35, size: 2 + Math.random() * 3, color: colors[i % colors.length], angle: Math.random() * 6, spin: Math.random() * 6 - 3 });
  }
  if (!particleFrame) {
    lastParticleTime = performance.now();
    particleFrame = requestAnimationFrame(drawParticles);
  }
}

function drawParticles(now) {
  const dt = Math.min((now - lastParticleTime) / 1000, .035);
  lastParticleTime = now;
  particleContext.clearRect(0, 0, 450, 800);
  particles = particles.filter(particle => particle.life > 0);
  for (const particle of particles) {
    particle.x += particle.vx * dt;
    particle.y += particle.vy * dt;
    particle.vy += 160 * dt;
    particle.life -= dt;
    particle.angle += particle.spin * dt;
    particleContext.save();
    particleContext.globalAlpha = Math.min(1, particle.life * 3);
    particleContext.translate(particle.x, particle.y);
    particleContext.rotate(particle.angle);
    particleContext.fillStyle = particle.color;
    particleContext.beginPath();
    for (let j = 0; j < 8; j++) {
      const angle = j * Math.PI / 4;
      const radius = j % 2 ? particle.size * .32 : particle.size;
      const x = Math.cos(angle) * radius;
      const y = Math.sin(angle) * radius;
      j ? particleContext.lineTo(x, y) : particleContext.moveTo(x, y);
    }
    particleContext.closePath();
    particleContext.fill();
    particleContext.restore();
  }
  if (particles.length) particleFrame = requestAnimationFrame(drawParticles);
  else { particleFrame = 0; particleContext.clearRect(0, 0, 450, 800); }
}

function finish() {
  if ($('end-screen').classList.contains('visible')) return;
  stopVoices();
  playSound('complete', audioGeneration);
  clearHint();
  $('end-screen').classList.add('visible');
  $('end-screen').setAttribute('aria-hidden', 'false');
  $('guests').inert = true;
  board.inert = true;
  for (let i = 0; i < 5; i++) later(() => burst(65 + i * 80, 285 + Math.random() * 35, 20), i * 95);
  later(() => $('replay').focus({ preventScroll: true }), reducedMotion.matches ? 30 : 450);
  announce('Sweet success! All eight guests are happy. Play again.');
}

function reset() {
  stopSounds();
  state.run++;
  timers.forEach(clearTimeout);
  timers.clear();
  animations.forEach(animation => animation.cancel());
  animations.clear();
  document.querySelectorAll('.flying-treat').forEach(element => element.remove());
  Object.assign(state, { stock: [4, 4, 4, 4, 4, 4], guests: [null, null], next: 0, served: 0, completed: 0, busy: false, ended: false, first: true });
  $('guests').innerHTML = '';
  board.innerHTML = '';
  $('guests').inert = false;
  board.inert = false;
  board.setAttribute('aria-busy', 'false');
  $('end-screen').classList.remove('visible');
  $('end-screen').setAttribute('aria-hidden', 'true');
  $('progress').setAttribute('aria-valuenow', '0');
  clearHint();
  KINDS.forEach((_, index) => renderStack(index));
  nextGuest(0, false);
  nextGuest(1, false);
  particles = [];
  if (particleFrame) cancelAnimationFrame(particleFrame);
  particleFrame = 0;
  particleContext.clearRect(0, 0, 450, 800);
  announce('Tap a matching pastry to serve.');
  later(hint, 650);
}

$('replay').addEventListener('click', () => {
  reset();
  $('stack-0').querySelector('.tile').focus({ preventScroll: true });
});
window.addEventListener('resize', fit);
if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
document.documentElement.style.setProperty('--atlas', 'url("' + ASSETS.atlas + '")');
document.documentElement.style.setProperty('--scene', 'url("' + ASSETS.background + '")');
$('background').src = ASSETS.background;
$('end-friends').innerHTML = '<div class="friend">' + sprite('monkey_happy') + '</div><div class="friend">' + sprite('toucan_happy') + '</div><span class="end-sparkle one">✦</span><span class="end-sparkle two">✦</span>';
fit();
reset();
</script>
</body>
