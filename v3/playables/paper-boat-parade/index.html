<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#38c9df">
<title>Paper Boat Parade</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center;background:#164e51;font-family:'Trebuchet MS',Arial,sans-serif;color:#184e59}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;cursor:pointer;font:inherit}
button:focus-visible{outline:3px solid #fff9ce;outline-offset:3px}
.game{--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);position:relative;isolation:isolate;width:min(100%,calc(100dvh * .5625));height:100dvh;overflow:hidden;background:#22c6e3;user-select:none;-webkit-user-select:none;touch-action:none}
#scene{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sound{position:absolute;z-index:2;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));width:40px;height:40px;border:1px solid #ffffffa6;border-radius:50%;display:grid;place-items:center;background:#fffae9d9;color:#547b6a;box-shadow:0 3px 0 #6e755d30,0 3px 12px #3b6d4b15}
.sound:active{transform:translateY(2px)}
.sound svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.targets{position:absolute;touch-action:none}
.boat-target{position:absolute;display:block;border:0;border-radius:14px;background:transparent;padding:0;touch-action:none}
.boat-target:disabled{pointer-events:none;cursor:default}
.boat-target:focus-visible{outline:2px dashed #fffce2;outline-offset:-3px;box-shadow:inset 0 0 0 4px #2b8d9b}
.cue{position:absolute;left:50%;z-index:1;transform:translateX(-50%);padding:8px 19px 10px;border:1px solid #ffffffb0;border-radius:22px;color:#fffef0;background:#158b9ac2;box-shadow:0 3px 12px #0b708529;white-space:nowrap;pointer-events:none;font-size:16px;font-weight:800;letter-spacing:.2px;text-shadow:0 2px 0 #08798b45;transition:opacity .25s,transform .25s}
.cue.dismissed{opacity:0;transform:translate(-50%,-7px)}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-size:16px;font-weight:700;color:#fff9df;text-shadow:0 2px 4px #0b7c91;background:#27bfdf}
.loading[hidden],.end[hidden]{display:none}
.end{position:absolute;inset:0;z-index:3;display:grid;place-items:center;padding:24px;background:#0e777a4d;backdrop-filter:blur(4px)}
.end-card{width:min(100%,310px);text-align:center;padding:8px 25px 27px;border-radius:32px;border:3px solid #fffdf1;background:linear-gradient(#fffcf0,#fff4d6);box-shadow:0 8px 0 #d5ba8660,0 20px 60px #155c6445;animation:pop-in .45s cubic-bezier(.2,.8,.3,1.15)}
#end-art{display:block;width:200px;height:144px;max-width:100%;margin:-33px auto -2px;pointer-events:none}
.end-card h1{font-size:31px;font-weight:800;letter-spacing:-1.1px;line-height:1.05;margin:10px 0;color:#236d69;text-shadow:0 2px 0 #fff}
.end-card p{font-size:14px;color:#6c8c77;margin:12px 0 23px}
.replay{display:block;width:100%;height:52px;border:2px solid #fff3b0;border-radius:18px;background:linear-gradient(#ffce6a,#ffad44);box-shadow:0 5px 0 #d58a38,0 8px 17px #d9a25f35;color:#70451f;font-size:17px;font-weight:800;text-shadow:0 1px 0 #fff0ba}
.replay:active{transform:translateY(3px);box-shadow:0 2px 0 #d58a38}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@keyframes pop-in{from{opacity:0;transform:translateY(22px) scale(.92)}to{opacity:1;transform:none}}
@media(orientation:landscape) and (max-height:600px){.game{width:100%}.cue{display:none}.end-card{padding-bottom:18px}#end-art{height:98px;margin-top:-20px}.end-card h1{font-size:28px}.end-card p{margin:8px 0 15px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="game" id="game" aria-label="Paper Boat Parade puzzle game" data-phase="loading">
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="targets" id="targets" role="group" aria-label="Tap a boat to sail in the direction of its arrow. Clear its lane first." aria-busy="true"></div>
  <button class="sound" id="sound" type="button" aria-label="Turn sound on" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5M16 9l5 6M21 9l-5 6"/></svg></button>
  <div class="cue" id="cue">Tap to sail</div>
  <div class="loading" id="loading" role="status">Filling the pond…</div>
  <span class="sr-only" id="announcement" aria-live="polite"></span>
  <div class="end" id="end" hidden>
    <section class="end-card" role="dialog" aria-modal="true" aria-labelledby="end-title">
      <canvas id="end-art" width="400" height="288" aria-hidden="true"></canvas>
      <h1 id="end-title">Lovely sailing!</h1>
      <p>Every little boat is free.</p>
      <button class="replay" id="replay" type="button">Play again ↻</button>
    </section>
  </div>
</main>
<script id="puzzle-engine">

const Puzzle = (() => {
  const cols = 6, rows = 7;
  const vectors = [[0,-1],[1,0],[0,1],[-1,0]];
  function blocker(board, boat) {
    const [dx,dy] = vectors[boat.dir];
    for (let x=boat.x+dx,y=boat.y+dy;x>=0&&x<cols&&y>=0&&y<rows;x+=dx,y+=dy) {
      const other=board.find(b=>b.x===x&&b.y===y);
      if(other) return other;
    }
    return null;
  }
  function legal(board,boat) { return !!boat && !blocker(board,boat); }
  function apply(board,id) {
    const boat=board.find(b=>b.id===id);
    if(!legal(board,boat)) return null;
    return board.filter(b=>b.id!==id).map(b=>({...b,dir:boat.gold&&Math.abs(b.x-boat.x)+Math.abs(b.y-boat.y)===1?(b.dir+1)%4:b.dir}));
  }
  function solution(board) {
    let rest=board.map(b=>({...b}));
    const order=[];
    while(rest.length) {
      const boat=rest.find(b=>!b.gold&&legal(rest,b))||rest.find(b=>legal(rest,b));
      if(!boat) return null;
      order.push(boat.id);rest=apply(rest,boat.id);
    }
    return order;
  }
  function makeLevel(index) {
    let seed=[941,2671,7813][index];
    const random=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};
    const board=[{id:0,x:2,y:2,dir:2,gold:false},{id:1,x:3,y:2,dir:3,gold:false},{id:2,x:2,y:3,dir:1,gold:false},{id:3,x:3,y:3,dir:0,gold:false},{id:4,x:1,y:2,dir:3,gold:true}];
    const reserved=new Set(['0,2','1,1','1,3']);
    const count=[18,24,28][index];
    while(board.length<count) {
      const choices=[];
      for(let y=0;y<rows;y++)for(let x=0;x<cols;x++) {
        if(reserved.has(x+','+y)||board.some(b=>b.x===x&&b.y===y))continue;
        for(let dir=0;dir<4;dir++)if(legal(board,{x,y,dir}))choices.push({x,y,dir});
      }
      const pick=choices[Math.floor(random()*choices.length)];
      board.push({id:board.length,...pick,gold:false});
    }
    return board.map(b=>index===1?{...b,x:cols-1-b.x,y:rows-1-b.y,dir:(b.dir+2)%4}:{...b});
  }
  return {cols,rows,vectors,blocker,legal,apply,solution,makeLevel};
})();

</script>
<script>
(() => {
  'use strict';
  const $=id=>document.getElementById(id);
  const game=$('game'),canvas=$('scene'),ctx=canvas.getContext('2d');
  const targets=$('targets'),cue=$('cue'),end=$('end'),soundButton=$('sound');
  const background=new Image(),atlas=new Image();
  const frames={"coral":{"x":8,"y":8,"w":192,"h":192},"mint":{"x":208,"y":8,"w":192,"h":192},"lilac":{"x":408,"y":8,"w":192,"h":192},"gold":{"x":608,"y":8,"w":192,"h":192}};
  const directions=['up','right','down','left'];
  const variants=['coral','mint','lilac'];
  const motion=matchMedia('(prefers-reduced-motion: reduce)');
  let reduced=motion.matches,phase='loading',level=0,board=[],total=0;
  let W=1,H=1,dpr=1,C=1,BX=0,BY=0;
  let scenery={s:1,x:0,y:0},water={x:0,y:0,w:1,h:1,r:20};
  let time=performance.now(),lockUntil=0,clearAt=0,transition=null;
  let movers=[],ripples=[],particles=[],turns=new Map(),bumps=new Map();
  let hoverId=null,pressId=null,blockerId=null,held=null,idleBoat=null;
  let idleAt=time,tutorialDone=false,ready=false,busy=true;
  let muted=true,audio=null,lastEscape=-10000,chain=0,entranceAt=time;
  const clamp=(v,min=0,max=1)=>Math.max(min,Math.min(max,v));
  const ease=v=>1-Math.pow(1-clamp(v),3);
  const centre=b=>[BX+(b.x+.5)*C,BY+(b.y+.5)*C];
  function line(g,points,color,width=1){
    g.beginPath();points.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));
    g.strokeStyle=color;g.lineWidth=width;g.lineCap='round';g.lineJoin='round';g.stroke();
  }
  function oval(g,x,y,rx,ry,color){g.beginPath();g.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2);g.fillStyle=color;g.fill();}
  function rounded(g,x,y,w,h,r,fill,stroke){g.beginPath();g.roundRect(x,y,w,h,r);if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.strokeStyle=stroke;g.lineWidth=1;g.stroke();}}
  function clipWater(g){g.beginPath();g.roundRect(water.x,water.y,water.w,water.h,water.r);g.clip();}
  function announce(message){$('announcement').textContent=message;}
  function setPhase(next){phase=next;game.dataset.phase=phase;updateBusy(true);}
  function updateBusy(force=false){
    const next=phase!=='play'||time<lockUntil;
    if(next===busy&&!force)return;
    busy=next;targets.setAttribute('aria-busy',String(busy));
    targets.querySelectorAll('button').forEach(b=>b.disabled=busy);
  }
  function updateSound(){
    soundButton.setAttribute('aria-pressed',String(!muted));
    soundButton.setAttribute('aria-label',muted?'Turn sound on':'Turn sound off');
    soundButton.innerHTML=muted?'<svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5M16 9l5 6M21 9l-5 6"/></svg>':'<svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5M15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/></svg>';
  }
  function sound(kind){
    if(muted)return;
    try{
      if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();
      if(audio.state==='suspended')audio.resume().catch(()=>{});
      const now=audio.currentTime;
      const notes=kind==='gold'?[523.25,659.25,783.99]:kind==='win'?[523.25,659.25,783.99,1046.5]:kind==='bump'?[150]:[440+(chain%5)*55,660+(chain%5)*55];
      notes.forEach((frequency,i)=>{
        const o=audio.createOscillator(),g=audio.createGain(),start=now+i*.07;
        o.type='sine';o.frequency.setValueAtTime(frequency,start);o.frequency.exponentialRampToValueAtTime(frequency*.7,start+.24);
        g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(kind==='bump'?.035:.065,start+.012);g.gain.exponentialRampToValueAtTime(.0001,start+.3);
        o.connect(g);g.connect(audio.destination);o.start(start);o.stop(start+.33);
      });
    }catch(_){muted=true;updateSound();}
  }
  function resize(){
    const bounds=game.getBoundingClientRect();W=bounds.width;H=bounds.height;
    if(!W||!H)return;
    dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
    if(!ready)return;
    const s=Math.max(W/background.width,H/background.height),x=(W-background.width*s)/2,y=(H-background.height*s)/2;
    scenery={s,x,y};
    const safeTop=parseFloat(getComputedStyle(game).getPropertyValue('--safe-top'))||0;
    const safeBottom=parseFloat(getComputedStyle(game).getPropertyValue('--safe-bottom'))||0;
    const left=Math.max(12,x+background.width*.065*s),right=Math.min(W-12,x+background.width*.935*s);
    const top=Math.max(safeTop+16,y+background.height*.183*s),bottom=Math.min(H-safeBottom-16,y+background.height*.795*s);
    C=Math.min((right-left)/6,(bottom-top)/7);BX=(left+right-C*6)/2;BY=(top+bottom-C*7)/2;
    water={x:x+background.width*.045*s,y:y+background.height*.174*s,w:background.width*.91*s,h:background.height*.639*s,r:background.width*.057*s};
    targets.style.left=BX+'px';targets.style.top=BY+'px';targets.style.width=C*6+'px';targets.style.height=C*7+'px';
    cue.style.top=Math.max(safeTop+16,BY-42)+'px';
  }
  function cancelPress(){held=null;hoverId=pressId=null;}
  function registerInteraction(){idleAt=time;idleBoat=null;tutorialDone=true;cue.classList.add('dismissed');}
  function syncTargets(){
    const active=document.activeElement;
    const focusId=active?.dataset?.boat;
    const keyboardFocus=active?.matches?.(':focus-visible');
    targets.replaceChildren();
    for(const boat of board){
      const button=document.createElement('button');button.type='button';button.className='boat-target';button.dataset.boat=boat.id;
      button.style.left=boat.x/6*100+'%';button.style.top=boat.y/7*100+'%';button.style.width=100/6+'%';button.style.height=100/7+'%';
      button.setAttribute('aria-label',`${boat.gold?'Golden boat':'Boat'}, row ${boat.y+1}, column ${boat.x+1}, pointing ${directions[boat.dir]}. ${Puzzle.legal(board,boat)?'Clear path.':'Lane blocked.'}`);
      button.addEventListener('pointerdown',e=>{
        time=performance.now();if(phase!=='play'||time<lockUntil||held||!e.isPrimary)return;
        held={id:boat.id,pointer:e.pointerId,x:e.clientX,y:e.clientY};pressId=boat.id;hoverId=boat.id;
      });
      button.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'&&phase==='play')hoverId=boat.id;});
      button.addEventListener('pointerleave',()=>{if(pressId!==boat.id)hoverId=null;});
      button.addEventListener('focus',()=>hoverId=boat.id);
      button.addEventListener('blur',()=>{if(hoverId===boat.id)hoverId=null;});
      button.addEventListener('click',e=>{if(e.detail===0)attempt(boat.id);});
      targets.appendChild(button);
    }
    if(focusId!==undefined&&keyboardFocus){
      const same=targets.querySelector(`[data-boat="${focusId}"]`);
      const next=board.find(b=>Puzzle.legal(board,b));
      (same||(next&&targets.querySelector(`[data-boat="${next.id}"]`)))?.focus({preventScroll:true});
    }
    game.dataset.pond=level+1;game.setAttribute('aria-label',`Paper Boat Parade. Pond ${level+1} of 3. ${total-board.length} of ${total} boats free.`);
    updateBusy(true);
  }
  function reset(index=0,keepTransition=false){
    time=performance.now();level=index;board=Puzzle.makeLevel(level);total=board.length;
    movers=[];ripples=[];particles=[];turns.clear();bumps.clear();cancelPress();idleBoat=blockerId=null;
    lockUntil=0;clearAt=0;lastEscape=-10000;chain=0;idleAt=time;entranceAt=time;tutorialDone=level!==0;
    if(!keepTransition)transition=null;
    end.hidden=true;soundButton.inert=false;targets.inert=false;
    cue.classList.toggle('dismissed',tutorialDone);
    setPhase(keepTransition?'transition':'play');syncTargets();
    announce(`Pond ${level+1}. Tap boats with clear lanes. The golden boat turns its immediate neighbours clockwise.`);
  }
  function attempt(id){
    time=performance.now();if(phase!=='play'||time<lockUntil)return;
    const boat=board.find(b=>b.id===id);if(!boat)return;
    cancelPress();registerInteraction();
    const obstacle=Puzzle.blocker(board,boat);
    if(obstacle){
      bumps.set(id,{start:time,dir:boat.dir});blockerId=obstacle.id;lockUntil=time+(reduced?70:260);updateBusy();sound('bump');
      announce(`Lane blocked by the boat in row ${obstacle.y+1}, column ${obstacle.x+1}.`);return;
    }
    const next=Puzzle.apply(board,id);
    if(boat.gold){
      for(const b of next){const before=board.find(v=>v.id===b.id);if(before.dir!==b.dir)turns.set(b.id,{from:before.dir,start:time+(reduced?0:160),duration:reduced?80:480});}
      ripples.push({x:boat.x+.5,y:boat.y+.5,start:time,duration:reduced?250:1050,gold:true});
      lockUntil=time+(reduced?100:700);sound('gold');
    }else{chain=time-lastEscape<1400?chain+1:0;lockUntil=time+(reduced?45:110);sound('sail');}
    lastEscape=time;board=next;
    movers.push({...boat,start:time,duration:reduced?170:750});
    ripples.push({x:boat.x+.5,y:boat.y+.5,start:time,duration:750,gold:false});
    if(!reduced)for(let i=0;i<6;i++){
      const [x,y]=centre(boat);particles.push({x:x+(Math.random()-.5)*C*.2,y:y+(Math.random()-.5)*C*.15,vx:(Math.random()-.5)*14,vy:10+Math.random()*10,start:time,duration:650,size:1.3+Math.random(),color:'#dcffff',kind:'drop'});
    }
    if(!board.length){clearAt=time+(reduced?250:1000);setPhase('clearing');}
    syncTargets();announce(`${total-board.length} of ${total} boats free.${boat.gold?' Neighbours turned clockwise.':''}`);
  }
  function celebrate(){
    if(reduced)return;
    for(let i=0;i<42;i++)particles.push({x:Math.random()*W,y:Math.random()*H*.3,vx:(Math.random()-.5)*35,vy:25+Math.random()*35,start:time+Math.random()*200,duration:2400+Math.random()*900,size:3+Math.random()*3,color:['#ffd0cc','#fff2ad','#ffc3e0','#effff2'][i%4],kind:'petal'});
  }
  function clearPond(){
    clearAt=0;sound('win');celebrate();
    if(level<2){transition={start:time,duration:reduced?260:1000,next:level+1,swapped:false};setPhase('transition');}
    else{
      setPhase('end');cue.classList.add('dismissed');end.hidden=false;targets.inert=true;soundButton.inert=true;
      $('replay').focus({preventScroll:true});announce('All three ponds are clear. Lovely sailing! Play again to start over.');
    }
  }
  function drawBackground(){ctx.drawImage(background,scenery.x,scenery.y,background.width*scenery.s,background.height*scenery.s);}
  function drawArrow(g,x,y,dir,size=9,alpha=1){
    g.save();g.globalAlpha*=alpha;g.translate(x,y);g.rotate(dir*Math.PI/2);
    line(g,[[0,size*.55],[0,-size*.65]],'#fff8dbd9',4.3);line(g,[[-size*.42,-size*.18],[0,-size*.65],[size*.42,-size*.18]],'#fff8dbd9',4.3);
    line(g,[[0,size*.55],[0,-size*.65]],'#285b67',2.2);line(g,[[-size*.42,-size*.18],[0,-size*.65],[size*.42,-size*.18]],'#285b67',2.2);g.restore();
  }
  function drawBoat(g,b,x,y,angle,size,alpha=1){
    const f=frames[b.gold?'gold':variants[b.id%3]];
    g.save();g.globalAlpha*=alpha;
    oval(g,x+size*.02,y+size*.17,size*.36,size*.13,'#075f8040');
    g.translate(x,y);g.rotate(angle);
    g.drawImage(atlas,f.x,f.y,f.w,f.h,-size/2,-size/2,size,size);
    // A separate bow marker stays crisp as the artwork turns.
    drawArrow(g,0,-size*.24,0,Math.max(7,size*.13));g.restore();
  }
  function drawGrid(g){
    for(let y=0;y<7;y++)for(let x=0;x<6;x++){
      rounded(g,BX+x*C+.6,BY+y*C+.6,C-1.2,C-1.2,Math.min(8,C*.13),(x+y)%2?'#ffffff08':'#027eab08','#c7ffff25');
    }
  }
  function drawWater(g){
    g.save();clipWater(g);drawGrid(g);
    if(!reduced){
      for(let i=0;i<7;i++){
        const y=BY+(i*67+time*.003)%(C*7),x=BX+C*.4+(i*83)%(C*5);
        g.globalAlpha=.13+Math.sin(time*.001+i)*.04;line(g,[[x-12,y],[x-3,y-2],[x+10,y-1],[x+18,y+1]],'#e5ffff',1.2);
      }
      g.globalAlpha=1;
    }
    const active=board.find(b=>b.id===(pressId??hoverId));
    if(active){
      const [x,y]=centre(active),[dx,dy]=Puzzle.vectors[active.dir],obstacle=Puzzle.blocker(board,active);
      const endpoint=obstacle?centre(obstacle):[x+dx*Math.max(W,H),y+dy*Math.max(W,H)];
      g.save();g.setLineDash([2,7]);line(g,[[x,y],endpoint],'#f7ffff80',1.7);g.restore();
      if(active.gold)for(const b of board){
        if(Math.abs(b.x-active.x)+Math.abs(b.y-active.y)!==1)continue;
        const [nx,ny]=centre(b);rounded(g,nx-C*.47,ny-C*.47,C*.94,C*.94,12,'#ffe99422','#fff3b5');
        g.fillStyle='#fff6c0';g.font=`bold ${Math.max(15,C*.28)}px Arial`;g.textAlign='right';g.fillText('↻',nx+C*.44,ny-C*.28);
      }
    }
    for(const r of ripples){
      const p=clamp((time-r.start)/r.duration),x=BX+r.x*C,y=BY+r.y*C;
      g.save();g.globalAlpha=(1-p)*(r.gold?.9:.5);g.strokeStyle=r.gold?'#fff0ac':'#e4ffff';g.lineWidth=r.gold?2.3:1.2;
      for(let j=0;j<(r.gold?3:2);j++){
        const rad=C*.12+p*C*(r.gold?1.8:.6)-j*C*.25;
        if(rad>0){g.beginPath();g.ellipse(x,y,rad,rad*(r.gold?1:.6),0,0,Math.PI*2);g.stroke();}
      }
